<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبد النور زقراوي | مصمم مواقع</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #111;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            padding: 20px;
            max-width: 600px;
        }
        h1 {
            font-size: 3rem;
            color: #d4af37;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background: #d4af37;
            color: #111;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .btn:hover {
            background: #e5c85b;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>عبد النور</h1>
        <p>مصمم مواقع إلكترونية</p>
        <a href="https://www.instagram.com/abdennour.dev.11" class="btn" target="_blank">تواصل معي على إنستغرام</a>
    </div>
</body>
</html>
