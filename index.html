<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عبد النور | مصمم مواقع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Cairo', sans-serif;
        background: #111;
        color: #fff;
        line-height: 1.7;
    }
    .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
    }
    .header {
        text-align: center;
        margin-bottom: 50px;
    }
    .avatar {
        width: 120px;
        height: 120px;
        background: #d4af37;
        border-radius: 50%;
        margin: 0 auto 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 3rem;
        font-weight: 900;
        color: #111;
    }
    h1 {
        font-size: 2.5rem;
        color: #d4af37;
        margin-bottom: 5px;
    }
    h2 {
        font-size: 1.2rem;
        color: #ccc;
        font-weight: 400;
        margin-bottom: 20px;
    }
    .bio {
        color: #aaa;
        max-width: 600px;
        margin: 0 auto 30px;
        font-size: 1.1rem;
        text-align: center;
    }
    .btn {
        display: inline-block;
        background: #d4af37;
        color: #111;
        padding: 15px 40px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: bold;
        font-size: 1.1rem;
        transition: 0.3s;
    }
    .btn:hover {
        background: #e5c85b;
        transform: translateY(-3px);
    }
    .section-title {
        text-align: center;
        font-size: 2rem;
        color: #d4af37;
        margin: 60px 0 30px;
    }
    .work-card {
        background: #222;
        border-radius: 15px;
        overflow: hidden;
        margin-bottom: 30px;
        border: 1px solid #333;
        transition: 0.3s;
    }
    .work-card:hover {
        border-color: #d4af37;
        transform: translateY(-5px);
    }
    .work-image img {
        width: 100%;
        height: 250px;
        object-fit: cover;
    }
    .work-info {
        padding: 20px;
    }
    .work-info h3 {
        font-size: 1.5rem;
        color: #d4af37;
        margin-bottom: 10px;
    }
    .work-info p {
        color: #aaa;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="avatar">ع</div>
            <h1>عبد النور</h1>
            <h2>مصمم مواقع إلكترونية</h2>
            <p class="bio">أصنع مواقع عصرية للمحلات والشركات في الجزائر. تصميم احترافي، سلة تسوق، وربط واتساب.</p>
            <a href="https://www.instagram.com/abdennour.dev.11" class="btn" target="_blank">تواصل معي على إنستغرام</a>
        </div>

        <h2 class="section-title">أعمالي</h2>
        <div class="work-card">
            <div class="work-image">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800&q=80" alt="إيمن فاست فود">
            </div>
            <div class="work-info">
                <h3>إيمن فاست فود</h3>
                <p>موقع وجبات سريعة مع سلة تسوق وربط واتساب.</p>
            </div>
        </div>
       <div class="work-card">
    <div class="work-image">
        <img src="https://images.unsplash.com/photo-1555529669-e69e7aa0ba9a?auto=format&fit=crop&w=800&q=80" alt="أوس ستايل">
    </div>
    <div class="work-info">
        <h3>أوس ستايل</h3>
        <p>متجر ملابس عصرية مع كتالوغ منتجات.</p>
    </div>
</div>
    </div>
</body>
</html>
