<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عبد النور | مصمم مواقع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Cairo', sans-serif;
        background: #111;
        color: #fff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }
    .container {
        padding: 20px;
        max-width: 600px;
    }
    .avatar {
        width: 120px;
        height: 120px;
        background: #d4af37;
        border-radius: 50%;
        margin: 0 auto 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 3rem;
        font-weight: 900;
        color: #111;
    }
    h1 {
        font-size: 2.5rem;
        color: #d4af37;
        margin-bottom: 5px;
    }
    h2 {
        font-size: 1.2rem;
        color: #ccc;
        font-weight: 400;
        margin-bottom: 30px;
    }
    p {
        color: #aaa;
        line-height: 1.8;
        margin-bottom: 30px;
        font-size: 1.1rem;
    }
    .btn {
        display: inline-block;
        background: #d4af37;
        color: #111;
        padding: 15px 40px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: bold;
        font-size: 1.1rem;
        transition: 0.3s;
    }
    .btn:hover {
        background: #e5c85b;
        transform: translateY(-3px);
    }
</style>
</head>
<body>
    <div class="container">
        <div class="avatar">ع</div>
        <h1>عبد النور</h1>
        <h2>مصمم مواقع إلكترونية</h2>
        <p>أصنع مواقع عصرية للمحلات والشركات في الجزائر. تصميم احترافي، سلة تسوق، وربط واتساب.</p>
        <a href="https://www.instagram.com/abdennour.dev.11" class="btn" target="_blank">تواصل معي على إنستغرام</a>
    </div>
</body>
</html>
